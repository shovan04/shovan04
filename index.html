<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Basic Meta Tags -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4ade80" />
    <meta
      name="description"
      content="Shovan Mondal is a backend-focused developer building reliable APIs, scalable systems, and practical software with Node.js, TypeScript, Python, and PostgreSQL."
    />
    <meta name="author" content="Shovan Mondal" />
    <meta
      name="keywords"
      content="Portfolio, Web Developer, Projects, Skills, Experience, Shovan Mondal, backend, frontend, fullstack"
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:title" content="Shovan Mondal - Portfolio" />
    <meta
      property="og:description"
      content="Explore Shovan Mondal’s selected projects, engineering skills, and professional journey."
    />
    <meta
      property="og:image"
      content="https://shovan04.info/ShovansPortfolioLogo.svg"
    />
    <meta property="og:url" content="https://shovan04.info" />
    <meta property="og:type" content="website" />

    <!-- Twitter Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Shovan Mondal - Portfolio" />
    <meta
      name="twitter:description"
      content="Backend-focused developer building reliable APIs, scalable systems, and practical software."
    />
    <meta
      name="twitter:image"
      content="https://shovan04.info/ShovansPortfolioLogo.svg"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      href="/ShovansPortfolioLogo.svg"
      type="image/svg+xml"
      sizes="any"
    />
    <link
      rel="icon"
      href="/ShovansPortfolioLogo.png"
      type="image/png"
      sizes="any"
    />
    <link rel="mask-icon" href="/ShovansPortfolioLogo.svg" color="#4ade80" />
    <link rel="apple-touch-icon" href="/ShovansPortfolioLogo.png" />

    <!-- Manifest for PWA -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Content Security Policy to help prevent XSS -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';"
    />

    <title>Shovan Mondal | Backend Developer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
